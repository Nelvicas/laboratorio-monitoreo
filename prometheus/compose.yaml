services:
  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    restart: "no"

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

    mem_limit: 512m

    networks:
      - monitoring-net

volumes:
  prometheus_data:

networks:
  monitoring-net:
    external: true
