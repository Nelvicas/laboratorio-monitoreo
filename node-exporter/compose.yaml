services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: lab-node-exporter
    restart: "no"

    ports:
      - "127.0.0.1:9100:9100"

    command:
      - '--path.rootfs=/host'

    volumes:
      #- '/:/host:ro,rslave'
      - '/:/host:ro'

    pid: host

    mem_limit: 128m

    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
